<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1e6"/><stop offset="1" stop-color="#ebe2d0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26272b"/><stop offset="1" stop-color="#101114"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="240" rx="14" fill="url(#paper)"/>
  <!-- distant ink hills -->
  <path d="M0 200 C150 150 260 170 360 140 C470 108 560 160 680 150 C820 138 930 96 1060 122 C1120 134 1170 150 1200 146 L1200 240 L0 240 Z" fill="#1a1b1f" opacity="0.06"/>
  <path d="M0 220 C180 190 300 206 470 186 C640 166 760 204 920 190 C1040 180 1130 194 1200 188 L1200 240 L0 240 Z" fill="#1a1b1f" opacity="0.08"/>
  <!-- the mark -->
  <g transform="translate(600 112)">
    <circle r="62" fill="none" stroke="#c9a227" stroke-width="2.5"/>
    <circle r="54" fill="#f9f5ec"/>
    <path d="M0 -54 A54 54 0 0 1 0 54 A27 27 0 0 1 0 0 A27 27 0 0 0 0 -54 Z" fill="url(#ink)"/>
    <circle r="54" fill="none" stroke="#141518" stroke-width="2.5"/>
    <circle cy="-27" r="8.5" fill="#141518"/>
    <circle cy="27" r="8.5" fill="#c41e3a"/>
  </g>
  <!-- gold rule with a cinnabar diamond -->
  <line x1="380" y1="206" x2="582" y2="206" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="618" y1="206" x2="820" y2="206" stroke="#c9a227" stroke-width="1.5"/>
  <rect x="594" y="200" width="12" height="12" transform="rotate(45 600 206)" fill="#c41e3a"/>
